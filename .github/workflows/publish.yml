name: Stage npm release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-stage
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          cache: npm
      - name: Install npm with staged publishing support
        run: npm install --global npm@11.15.0
      - name: Verify version is not published
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${name}/${version}`);
          if (response.status !== 404) throw new Error(`Cannot stage ${name}@${version}: registry returned ${response.status}`);
          console.log(`Preparing ${name}@${version} from ${{ github.sha }}`);
          JS
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
      - name: Stage package for manual approval
        run: npm stage publish 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
